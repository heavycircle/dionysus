# GitHub Release notes, generated by .github/workflows/release.yml from the
# commits since the previous tag. Preview locally with `git cliff --unreleased`
# (or `--latest` once tagged). There is deliberately no CHANGELOG.md: the
# Releases page is the changelog.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.breaking %} **(breaking)**{% endif %} ({{ commit.id | truncate(length=9, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# History before CONTRIBUTING.md isn't conventional; list it rather than drop it.
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The HTML comments only order the groups; striptags removes them from the output.
commit_parsers = [
    { message = "^release: ", skip = true },
    { message = "^build: bump version", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^docs", group = "<!-- 3 -->Documentation" },
    { message = "^(build|ci)", group = "<!-- 4 -->Build and CI" },
    { message = ".*", group = "<!-- 5 -->Other changes" },
]
