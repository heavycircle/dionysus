name: Set up Zig
description: Install the Zig version pinned in build.zig.zon, verified by checksum.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # Keep in sync with minimum_zig_version in build.zig.zon and the Dockerfile.
        ZIG_VERSION: 0.17.1
        ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
      run: |
        curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
        echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/zig"
        tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
        echo "$RUNNER_TEMP/zig" >>"$GITHUB_PATH"
