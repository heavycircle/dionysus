# Publishes a GitHub Release for every vX.Y.Z tag pushed by scripts/release.sh:
# dino archives for each supported platform, SHA256SUMS, and notes generated
# from the commits since the previous tag (cliff.toml).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # git-cliff and `git describe` need the full history and tags.
          fetch-depth: 0

      - name: Check the tag matches build.zig.zon
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! grep -q "^    \.version = \"$version\",\$" build.zig.zon; then
            echo "::error::$GITHUB_REF_NAME is not on a release commit (build.zig.zon does not say $version)"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - uses: ./.github/actions/setup-zig

      - run: zig build test

      - run: scripts/dist.sh "$VERSION" dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      # Re-running the workflow for an existing release replaces its assets.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "dino $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
