# Publishes a release for every vX.Y.Z tag pushed by scripts/release.sh:
# - a GitHub Release with dino archives for each supported platform,
#   SHA256SUMS, and notes generated from the commits in the release (cliff.toml)
# - the Docker image, for linux/amd64 and linux/arm64, as ghcr.io/<repo>:X.Y.Z,
#   and as :X.Y if it's the newest
#   X.Y.Z (re-running v0.5.0 after v0.5.1 leaves :0.5 alone)
# - if it's the newest version, the moving `stable` git tag and the :stable and
#   :latest images. A patch for an older line (v0.1.3 after v0.2.0) leaves them
#   alone, and isn't GitHub's "Latest" release either.
#
# Nothing is published until every ci.yml job has passed on the tagged commit
# and the image has passed tests/image.sh. The GitHub Release comes last.
#
# Run it by hand (Actions > release > Run workflow) to redo an existing tag.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true
      ci:
        description: Run the ci jobs on the tag first (untick for a tag whose tree predates today's ci.yml)
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    if: github.event_name == 'push' || inputs.ci
    uses: ./.github/workflows/ci.yml
    with:
      # The env context isn't available here.
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    needs: ci
    # A job whose dependency was skipped is skipped too unless it says
    # otherwise, here and in the jobs below.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      newest: ${{ steps.version.outputs.newest }}
      newest_in_series: ${{ steps.version.outputs.newest_in_series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
          # git-cliff and `git describe` need the full history and tags.
          fetch-depth: 0

      - name: Check the tag is a release commit
        id: version
        run: |
          version=${TAG#v}
          if ! grep -q "^    \.version = \"$version\",\$" build.zig.zon; then
            echo "::error::$TAG is not on a release commit (build.zig.zon does not say $version)"
            exit 1
          fi
          newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          series=$(git tag --list "v${version%.*}.[0-9]*" | sort -V | tail -n 1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "newest=$([[ $newest == "$TAG" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "newest_in_series=$([[ $series == "$TAG" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "$TAG: version $version, newest release: $newest, newest ${version%.*}.x: $series"

      - uses: ./.github/actions/setup-zig

      - run: zig build test

      - run: scripts/dist.sh "${{ steps.version.outputs.version }}" dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The action downloads git-cliff itself: pinned, so notes format alike.
          version: v2.14.2
          config: cliff.toml
          # The tag at HEAD, so a re-run of an older tag gets its own notes.
          args: --current --strip header
        env:
          OUTPUT: notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 1

  # Each architecture is built, tested and pushed on a runner of its own
  # (arm64 natively, on GitHub's arm runner), by digest only; image-manifest
  # then puts both under the release's tags.
  image:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    name: image-${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dionysus:release
          # The build context has no .git; pass the exact version. A published
          # image warms its zig cache (Dockerfile); CI's per-PR images don't.
          build-args: |
            DINO_VERSION=${{ needs.build.outputs.version }}
            WARM_ZIG_CACHE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # From scratch, never from layers an earlier main build cached: a
          # release gets that day's Debian security updates.
          no-cache: true

      # A tag from before the script existed is re-published untested.
      - name: Test the image
        if: hashFiles('tests/image.sh') != ''
        env:
          DINO_IMAGE_WARM: 1
        run: tests/image.sh dionysus:release "${{ needs.build.outputs.version }}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The same build again: every layer comes from the builder's cache of
      # the build just tested. Pushed by digest, with no tag of its own.
      - name: Push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            DINO_VERSION=${{ needs.build.outputs.version }}
            WARM_ZIG_CACHE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag for both architectures: Docker pulls the one for its host.
  image-manifest:
    needs: [build, image]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Provenance attestation for the published image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag both architectures
        id: manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NEWEST: ${{ needs.build.outputs.newest }}
          NEWEST_IN_SERIES: ${{ needs.build.outputs.newest_in_series }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags=(-t "$image:$VERSION")
          [[ $NEWEST_IN_SERIES == true ]] && tags+=(-t "$image:${VERSION%.*}")
          [[ $NEWEST == true ]] && tags+=(-t "$image:stable" -t "$image:latest")
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do sources+=("$image@sha256:${digest##*/}"); done
          ((${#sources[@]} == 2)) || { echo "::error::expected 2 image digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      # Verify with: gh attestation verify oci://ghcr.io/<repo>:<tag> -R <repo>
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [build, image-manifest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.image-manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Provenance attestations for the archives.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      # Verify a download with: gh attestation verify <archive> -R heavycircle/dionysus
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/dist/dino-*

      # Re-running for an existing release replaces its assets and keeps the
      # notes. GitHub marks a new release "Latest" unless told otherwise.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NEWEST: ${{ needs.build.outputs.newest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/dist/* --clobber
          else
            gh release create "$TAG" out/dist/* --verify-tag --latest="$NEWEST" \
              --title "dino $VERSION" --notes-file out/notes.md
          fi

      # Tags pushed with the workflow token don't trigger workflows, and
      # `stable` doesn't match the vX.Y.Z filter anyway.
      - name: Move the stable tag
        if: needs.build.outputs.newest == 'true'
        run: |
          git tag -f stable "$TAG^{commit}"
          git push -f origin refs/tags/stable
