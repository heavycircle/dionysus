# Publishes a release for every vX.Y.Z tag pushed by scripts/release.sh:
# - a GitHub Release with dino archives for each supported platform,
#   SHA256SUMS, and notes generated from the commits in the release (cliff.toml)
# - the Docker image as ghcr.io/<repo>:X.Y.Z, and as :X.Y if it's the newest
#   X.Y.Z (re-running v0.5.0 after v0.5.1 leaves :0.5 alone)
# - if it's the newest version, the moving `stable` git tag and the :stable and
#   :latest images. A patch for an older line (v0.1.3 after v0.2.0) leaves them
#   alone, and isn't GitHub's "Latest" release either.
#
# Nothing is published until every ci.yml job has passed on the tagged commit
# and the image has passed tests/image.sh. The GitHub Release comes last.
#
# Run it by hand (Actions > release > Run workflow) to redo an existing tag.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true
      ci:
        description: Run the ci jobs on the tag first (untick for a tag whose tree predates today's ci.yml)
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    if: github.event_name == 'push' || inputs.ci
    uses: ./.github/workflows/ci.yml
    with:
      # The env context isn't available here.
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    needs: ci
    # A job whose dependency was skipped is skipped too unless it says
    # otherwise, here and in the jobs below.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      newest: ${{ steps.version.outputs.newest }}
      newest_in_series: ${{ steps.version.outputs.newest_in_series }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          # git-cliff and `git describe` need the full history and tags.
          fetch-depth: 0

      - name: Check the tag is a release commit
        id: version
        run: |
          version=${TAG#v}
          if ! grep -q "^    \.version = \"$version\",\$" build.zig.zon; then
            echo "::error::$TAG is not on a release commit (build.zig.zon does not say $version)"
            exit 1
          fi
          newest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          series=$(git tag --list "v${version%.*}.[0-9]*" | sort -V | tail -n 1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "newest=$([[ $newest == "$TAG" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "newest_in_series=$([[ $series == "$TAG" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "$TAG: version $version, newest release: $newest, newest ${version%.*}.x: $series"

      - uses: ./.github/actions/setup-zig

      - run: zig build test

      - run: scripts/dist.sh "${{ steps.version.outputs.version }}" dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # The tag at HEAD, so a re-run of an older tag gets its own notes.
          args: --current --strip header
        env:
          OUTPUT: notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NEWEST: ${{ needs.build.outputs.newest }}
          NEWEST_IN_SERIES: ${{ needs.build.outputs.newest_in_series }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags="$image:$VERSION"
          [[ $NEWEST_IN_SERIES == true ]] && tags="$tags,$image:${VERSION%.*}"
          [[ $NEWEST == true ]] && tags="$tags,$image:stable,$image:latest"
          echo "tags=$tags" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dionysus:release
          # The build context has no .git; pass the exact version. A published
          # image warms its zig cache (Dockerfile); CI's per-PR images don't.
          build-args: |
            DINO_VERSION=${{ needs.build.outputs.version }}
            WARM_ZIG_CACHE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      # A tag from before the script existed is re-published untested.
      - name: Test the image
        if: hashFiles('tests/image.sh') != ''
        env:
          DINO_IMAGE_WARM: 1
        run: tests/image.sh dionysus:release "${{ needs.build.outputs.version }}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The same build again: every layer comes from the builder's cache.
      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DINO_VERSION=${{ needs.build.outputs.version }}
            WARM_ZIG_CACHE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

  publish:
    needs: [build, image]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out

      # Re-running for an existing release replaces its assets and keeps the
      # notes. GitHub marks a new release "Latest" unless told otherwise.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NEWEST: ${{ needs.build.outputs.newest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/dist/* --clobber
          else
            gh release create "$TAG" out/dist/* --verify-tag --latest="$NEWEST" \
              --title "dino $VERSION" --notes-file out/notes.md
          fi

      # Tags pushed with the workflow token don't trigger workflows, and
      # `stable` doesn't match the vX.Y.Z filter anyway.
      - name: Move the stable tag
        if: needs.build.outputs.newest == 'true'
        run: |
          git tag -f stable "$TAG^{commit}"
          git push -f origin refs/tags/stable
