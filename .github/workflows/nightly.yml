# Rebuilds the `nightly` prerelease from main: dino archives for every platform
# (dino-nightly-<platform>, so the download URLs never change), SHA256SUMS,
# notes for everything since the last release, and the ghcr.io/<repo>:nightly
# image for linux/amd64 and linux/arm64. Runs only when ci.yml passed for main's head, and scheduled runs skip
# when that commit is already published. The image goes first and the release
# notes, which name the commit, last: a run that fails part-way is redone the
# next night, and the assets are replaced in place so their URLs never 404.
name: nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency: nightly

jobs:
  # Whether to publish, and the version every job builds.
  check:
    # Forks don't publish nightlies.
    if: github.repository == 'heavycircle/dionysus'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          # `git describe` (the version) needs history and tags.
          fetch-depth: 0

      - name: Skip if main is already published or its ci didn't pass
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          notes=$(gh release view nightly --json body --jq .body 2>/dev/null || true)
          if [[ $GITHUB_EVENT_NAME == schedule && $head == "$last" && $notes == *"$head"* ]]; then
            echo "main is still at the last nightly ($head); nothing to do"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh run list --workflow ci --branch main --event push --commit "$head" --limit 1 \
            --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          if [[ $ci != "completed success" ]]; then
            echo "::warning::ci for main ($head) is '${ci:-missing}', not a success; not publishing it"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-zig
        if: steps.check.outputs.skip != 'true'

      - name: Version
        id: version
        if: steps.check.outputs.skip != 'true'
        run: |
          zig build
          echo "version=$(zig-out/bin/dino version | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

  # Each architecture on a runner of its own, pushed by digest only; publish
  # puts both under :nightly.
  image:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    name: image-${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            DINO_VERSION=${{ needs.check.outputs.version }}
            WARM_ZIG_CACHE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: ${{ matrix.arch == 'arm64' && 'type=gha,scope=arm64' || 'type=gha' }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  nightly:
    needs: [check, image]
    if: needs.check.outputs.skip != 'true' && needs.image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # `git describe` (the version) and git-cliff need history and tags.
          fetch-depth: 0

      - uses: ./.github/actions/setup-zig

      - name: Test and build
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          zig build test
          DINO_DIST_LABEL=nightly scripts/dist.sh "$VERSION" dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The action downloads git-cliff itself: pinned, so notes format alike.
          version: v2.14.2
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: ${{ runner.temp }}/changes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One tag for both architectures: Docker pulls the one for its host.
      - name: Tag both architectures
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do sources+=("$image@sha256:${digest##*/}"); done
          ((${#sources[@]} == 2)) || { echo "::error::expected 2 image digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create -t "$image:nightly" "${sources[@]}"

      - name: Publish the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            echo "Built from \`main\` at $(git rev-parse HEAD): \`dino version\` reports $VERSION."
            echo "Rebuilt daily when main changes; for releases see https://github.com/$GITHUB_REPOSITORY/releases/latest."
            echo
            echo "## Changes since the last release"
            cat "$RUNNER_TEMP/changes.md"
          } >"$RUNNER_TEMP/notes.md"
          git tag -f nightly HEAD
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            # Last: the skip check above looks for the commit in the notes.
            gh release edit nightly --prerelease --verify-tag \
              --title "dino nightly ($VERSION)" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create nightly dist/* --prerelease --verify-tag \
              --title "dino nightly ($VERSION)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
