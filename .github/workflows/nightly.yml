# Rebuilds the `nightly` prerelease from main: dino archives for every platform
# (dino-nightly-<platform>, so the download URLs never change), SHA256SUMS,
# notes for everything since the last release, and the ghcr.io/<repo>:nightly
# image. Scheduled runs skip when main hasn't moved since the last nightly.
name: nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency: nightly

jobs:
  nightly:
    # Forks don't publish nightlies.
    if: github.repository == 'heavycircle/dionysus'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # `git describe` (the version) and git-cliff need history and tags.
          fetch-depth: 0

      - name: Skip if main hasn't moved
        id: check
        run: |
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [[ $head == "$last" && $GITHUB_EVENT_NAME == schedule ]]; then
            echo "main is still at the last nightly ($head); nothing to do"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-zig
        if: steps.check.outputs.skip != 'true'

      - name: Test and build
        id: build
        if: steps.check.outputs.skip != 'true'
        run: |
          zig build test
          zig build
          version=$(zig-out/bin/dino version | cut -d' ' -f2)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          DINO_DIST_LABEL=nightly scripts/dist.sh "$version" dist

      - name: Generate release notes
        if: steps.check.outputs.skip != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: ${{ runner.temp }}/changes.md

      - name: Publish the nightly prerelease
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "Built from \`main\` at $(git rev-parse --short HEAD): \`dino version\` reports $VERSION."
            echo "Rebuilt daily when main changes; for releases see https://github.com/$GITHUB_REPOSITORY/releases/latest."
            echo
            echo "## Changes since the last release"
            cat "$RUNNER_TEMP/changes.md"
          } >"$RUNNER_TEMP/notes.md"
          gh release delete nightly --cleanup-tag --yes || true
          git tag -f nightly HEAD
          git push -f origin refs/tags/nightly
          gh release create nightly dist/* --prerelease --verify-tag \
            --title "dino nightly ($VERSION)" --notes-file "$RUNNER_TEMP/notes.md"

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:nightly
          build-args: DINO_VERSION=${{ steps.build.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
