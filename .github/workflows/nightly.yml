# Rebuilds the `nightly` prerelease from main: dino archives for every platform
# (dino-nightly-<platform>, so the download URLs never change), SHA256SUMS,
# notes for everything since the last release, and the ghcr.io/<repo>:nightly
# image. Runs only when ci.yml passed for main's head, and scheduled runs skip
# when that commit is already published. The image goes first and the release
# notes, which name the commit, last: a run that fails part-way is redone the
# next night, and the assets are replaced in place so their URLs never 404.
name: nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency: nightly

jobs:
  nightly:
    # Forks don't publish nightlies.
    if: github.repository == 'heavycircle/dionysus'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          # `git describe` (the version) and git-cliff need history and tags.
          fetch-depth: 0

      - name: Skip if main is already published or its ci didn't pass
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          notes=$(gh release view nightly --json body --jq .body 2>/dev/null || true)
          if [[ $GITHUB_EVENT_NAME == schedule && $head == "$last" && $notes == *"$head"* ]]; then
            echo "main is still at the last nightly ($head); nothing to do"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh run list --workflow ci --branch main --event push --commit "$head" --limit 1 \
            --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          if [[ $ci != "completed success" ]]; then
            echo "::warning::ci for main ($head) is '${ci:-missing}', not a success; not publishing it"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-zig
        if: steps.check.outputs.skip != 'true'

      - name: Test and build
        id: build
        if: steps.check.outputs.skip != 'true'
        run: |
          zig build test
          zig build
          version=$(zig-out/bin/dino version | cut -d' ' -f2)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          DINO_DIST_LABEL=nightly scripts/dist.sh "$version" dist

      - name: Generate release notes
        if: steps.check.outputs.skip != 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The action downloads git-cliff itself: pinned, so notes format alike.
          version: v2.14.2
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: ${{ runner.temp }}/changes.md

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:nightly
          build-args: |
            DINO_VERSION=${{ steps.build.outputs.version }}
            WARM_ZIG_CACHE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      - name: Publish the nightly prerelease
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "Built from \`main\` at $(git rev-parse HEAD): \`dino version\` reports $VERSION."
            echo "Rebuilt daily when main changes; for releases see https://github.com/$GITHUB_REPOSITORY/releases/latest."
            echo
            echo "## Changes since the last release"
            cat "$RUNNER_TEMP/changes.md"
          } >"$RUNNER_TEMP/notes.md"
          git tag -f nightly HEAD
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            # Last: the skip check above looks for the commit in the notes.
            gh release edit nightly --prerelease --verify-tag \
              --title "dino nightly ($VERSION)" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create nightly dist/* --prerelease --verify-tag \
              --title "dino nightly ($VERSION)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
