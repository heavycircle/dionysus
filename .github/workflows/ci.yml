# Lint, unit tests, and per target: every example built and run, and the SDK's
# own tests (sdk/tests) run with `dino test`, natively, under qemu-user or under
# wine, inside the project's Docker image so CI and local runs match. The
# Windows builds of the SDK tests also run on Windows itself.
name: ci

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*"]
  # release.yml runs all of this on the tagged commit before publishing anything.
  workflow_call:
    inputs:
      ref:
        description: What to check out; empty means the commit that started the run
        type: string
        default: ""

permissions:
  contents: read

# A pull request's runs replace each other; runs for a branch queue up. The
# group names the pull request by number, not by github.ref: a run that starts
# after its pull request was merged has the base branch as its ref, and would
# cancel that branch's own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - uses: astral-sh/setup-uv@v6

      - name: zig fmt
        run: zig fmt --check build.zig cli

      # Pinned so CI and `uvx` on a contributor's machine format identically.
      - name: clang-format
        run: git ls-files '*.c' '*.h' | xargs uvx --from clang-format==19.1.7 clang-format --dry-run --Werror

      - name: shellcheck
        run: git ls-files '*.sh' | xargs uvx --from shellcheck-py==0.10.0.1 shellcheck

      # Every public header compiles alone as C and C++, has extern "C" guards
      # and stays in the dino_ / DINO_ namespace.
      - name: Public headers
        run: tests/headers.sh

      # Analyzes the SDK under x86_64 and win64 compile databases, so both
      # sides of every #ifdef _WIN32 are checked. Needs the dino from this checkout.
      - name: clang-tidy
        run: zig build && scripts/tidy.sh uvx --from clang-tidy==19.1.0 clang-tidy

      # The .clang-format that `dino init` writes must stay readable by the
      # clang-format of older distributions (Ubuntu 22.04 has 14), and the
      # files init writes must already follow it.
      - name: dino init's .clang-format with an old clang-format
        run: |
          zig-out/bin/dino init --no-configure "$RUNNER_TEMP/formatted"
          cd "$RUNNER_TEMP/formatted"
          uvx --from clang-format==14.0.6 clang-format --dry-run --Werror src/main.c tests/test_main.c

      - name: Version pins agree
        run: tests/pins.sh

      - name: Commit message linter
        run: tests/lintcommit.sh

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: scripts/lintcommit.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # build.zig derives the version from `git describe`.
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - uses: astral-sh/setup-uv@v6
      - run: zig build test

      # A new project and the SDK tests, built with the oldest CMake dino supports.
      - name: Oldest supported CMake
        run: zig build && tests/cmake-minimum.sh

  targets:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [arm, arm64, i386, ppc, win32, win64, x86_64]
    name: targets (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3

      # The image builds dino from this checkout, so the matrix tests the PR's dino.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dionysus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and run every example
        run: |
          docker run --rm -e CFLAGS="-Wall -Wextra -Werror" -v "$PWD:/repo:ro" \
            dionysus:ci /repo/tests/examples.sh /repo/examples "${{ matrix.target }}"

      # sdk/tests with `dino test`: utest.h tests under qemu/wine, plus the leak
      # counter on the Linux targets.
      - name: SDK tests
        run: |
          docker run --rm -e CFLAGS="-Wall -Wextra -Werror" -v "$PWD:/repo:ro" \
            dionysus:ci /repo/tests/sdk.sh "${{ matrix.target }}"

      # sdk/portability: every flagged call warns exactly as expected, in four
      # language modes, and the opt-outs silence them.
      - name: Portability warnings
        run: |
          docker run --rm -e CFLAGS="-Wall -Wextra -Werror" -v "$PWD:/repo:ro" \
            dionysus:ci /repo/tests/warnings.sh "${{ matrix.target }}"

      # CMake configure checks (check_function_exists, ...) test this target.
      - name: Configure checks
        run: docker run --rm -v "$PWD:/repo:ro" dionysus:ci /repo/tests/configure.sh "${{ matrix.target }}"

      # docs/: every link resolves, and every complete C program builds and runs.
      - name: Documentation
        run: |
          docker run --rm -e CFLAGS="-Wall -Wextra -Werror" -v "$PWD:/repo:ro" \
            dionysus:ci /repo/tests/docs.sh "${{ matrix.target }}"

      - name: Portability warnings against glibc
        if: matrix.target == 'x86_64'
        run: |
          docker run --rm -e CFLAGS="-Wall -Wextra -Werror" -v "$PWD:/repo:ro" \
            dionysus:ci /repo/tests/warnings.sh --memcheck

      - name: SDK tests under valgrind
        if: matrix.target == 'x86_64'
        run: |
          docker run --rm -e CFLAGS="-Wall -Wextra -Werror" -v "$PWD:/repo:ro" \
            dionysus:ci /repo/tests/sdk.sh --memcheck

  # The two checks below don't depend on the target. They are the slowest in
  # the run, so each has a job of its own instead of making one target job take
  # three times as long as the others.
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3

      # The `targets` jobs write the layer cache; this one only reads it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dionysus:ci
          cache-from: type=gha

      - name: dino command line
        run: docker run --rm -v "$PWD:/repo:ro" dionysus:ci /repo/tests/cli.sh

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dionysus:ci
          cache-from: type=gha

      # The image's entrypoint: files in a mounted project keep their owner.
      - name: Docker image ownership
        run: tests/docker.sh dionysus:ci

  # Cross-compiled here, as users do it, and run by the `windows` jobs.
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig

      - name: Build the SDK tests for win64 and win32
        env:
          CFLAGS: -Wall -Wextra -Werror
        run: |
          zig build
          cp -r sdk/tests "$RUNNER_TEMP/tests"
          DINO_SDK_PATH=$PWD/sdk zig-out/bin/dino build win64 win32 -C "$RUNNER_TEMP/tests"
          for target in win64 win32; do
              # dino build leaves the dino_test() executables out; dino test
              # would also run them, which this runner can't.
              cmake --build "$RUNNER_TEMP/tests/build/$target" --target dino_tests
              mkdir -p "$RUNNER_TEMP/windows/$target"
              cp "$RUNNER_TEMP/tests/build/$target"/test_*.exe "$RUNNER_TEMP/windows/$target/"
          done
          # With the executables, so the Windows job needs no checkout (which
          # would give the script CRLF line endings).
          cp tests/windows.sh "$RUNNER_TEMP/windows/"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-tests-windows
          path: ${{ runner.temp }}/windows
          retention-days: 1

  # The only place the Windows halves of the SDK run on Windows: wine skips
  # or can't fail some cases (symbolic links, SO_REUSEADDR).
  windows:
    needs: windows-build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        target: [win32, win64]
    name: windows (${{ matrix.target }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-tests-windows
          path: windows

      - name: SDK tests on Windows
        shell: bash
        run: bash windows/windows.sh "windows/${{ matrix.target }}"
